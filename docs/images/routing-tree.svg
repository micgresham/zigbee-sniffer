<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="360" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="18" font-weight="700">Reading the routing tree</text>

  <!-- graph area -->
  <rect x="24" y="56" width="540" height="284" rx="12" fill="#0f141b" stroke="#2a3340"/>

  <!-- edges -->
  <line x1="290" y1="200" x2="180" y2="120" stroke="#3fb950" stroke-width="2"/>
  <line x1="290" y1="200" x2="410" y2="120" stroke="#d29922" stroke-width="2"/>
  <line x1="290" y1="200" x2="240" y2="290" stroke="#3fb950" stroke-width="2"/>
  <line x1="180" y1="120" x2="110" y2="200" stroke="#3fb950" stroke-width="2"/>
  <line x1="410" y1="120" x2="470" y2="210" stroke="#f85149" stroke-width="2"/>
  <line x1="410" y1="120" x2="470" y2="70" stroke="#3a4452" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- net lqi labels -->
  <text x="230" y="155" fill="#3fb950" font-size="11" font-weight="700">210</text>
  <text x="356" y="155" fill="#d29922" font-size="11" font-weight="700">120</text>
  <text x="452" y="170" fill="#f85149" font-size="11" font-weight="700">60</text>

  <!-- nodes -->
  <circle cx="290" cy="200" r="12" fill="#58a6ff"/><text x="290" y="234" fill="#8b97a3" font-size="10" text-anchor="middle">coordinator</text>
  <circle cx="180" cy="120" r="8" fill="#c9d4e0"/><text x="180" y="104" fill="#aeb9c4" font-size="10" text-anchor="middle">Hallway</text>
  <circle cx="410" cy="120" r="8" fill="#c9d4e0"/><text x="410" y="104" fill="#aeb9c4" font-size="10" text-anchor="middle">Family rm</text>
  <circle cx="110" cy="200" r="5" fill="#8b97a3"/><text x="110" y="222" fill="#aeb9c4" font-size="10" text-anchor="middle">Motion</text>
  <circle cx="240" cy="290" r="5" fill="#8b97a3"/><text x="240" y="312" fill="#aeb9c4" font-size="10" text-anchor="middle">Door</text>
  <circle cx="470" cy="210" r="5" fill="#8b97a3"/><text x="470" y="232" fill="#aeb9c4" font-size="10" text-anchor="middle">Bulb</text>
  <circle cx="470" cy="70" r="5" fill="#f85149"/><text x="470" y="56" fill="#aeb9c4" font-size="10" text-anchor="middle">Sun rm</text>

  <!-- legend -->
  <rect x="584" y="56" width="252" height="284" rx="12" fill="#161b22" stroke="#2a3340"/>
  <text x="602" y="82" fill="#8b97a3" font-size="12" font-weight="700">LEGEND</text>
  <circle cx="612" cy="112" r="7" fill="#58a6ff"/><text x="630" y="116" fill="#e6edf3" font-size="12">coordinator (center)</text>
  <circle cx="612" cy="140" r="7" fill="#c9d4e0"/><text x="630" y="144" fill="#e6edf3" font-size="12">router (bigger dot)</text>
  <circle cx="612" cy="168" r="5" fill="#8b97a3"/><text x="630" y="172" fill="#e6edf3" font-size="12">end device (small)</text>
  <circle cx="612" cy="196" r="5" fill="#f85149"/><text x="630" y="200" fill="#e6edf3" font-size="12">isolated / weak</text>

  <line x1="602" y1="224" x2="624" y2="224" stroke="#3fb950" stroke-width="3"/><text x="632" y="228" fill="#e6edf3" font-size="12">strong link ⌖</text>
  <line x1="602" y1="248" x2="624" y2="248" stroke="#f85149" stroke-width="3"/><text x="632" y="252" fill="#e6edf3" font-size="12">weak link ⌖</text>
  <line x1="602" y1="272" x2="624" y2="272" stroke="#3a4452" stroke-width="2" stroke-dasharray="4 4"/><text x="632" y="276" fill="#e6edf3" font-size="12">parent not yet seen</text>
  <text x="602" y="304" fill="#5b6672" font-size="11">Numbers on links = Net LQI (toggle).</text>
  <text x="602" y="322" fill="#5b6672" font-size="11">Scroll = zoom · drag = pan · isolate</text>
  <text x="602" y="337" fill="#5b6672" font-size="11">a device to see just its path.</text>
</svg>
