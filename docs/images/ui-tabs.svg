<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="430" fill="#0d1117"/>
  <!-- header -->
  <rect x="0" y="0" width="860" height="52" fill="#0d1117"/>
  <text x="24" y="32" fill="#e6edf3" font-size="16" font-weight="700">Zigbee <tspan fill="#58a6ff">Sniffer</tspan> · Tethered</text>
  <rect x="230" y="16" width="150" height="22" rx="11" fill="#0d2a16"/>
  <text x="305" y="31" fill="#3fb950" font-size="11" text-anchor="middle">● receiving from device</text>
  <rect x="392" y="16" width="120" height="22" rx="11" fill="#0d2a16"/>
  <text x="452" y="31" fill="#3fb950" font-size="11" text-anchor="middle">● capturing · ch 20</text>
  <text x="836" y="31" fill="#8b97a3" font-size="11" text-anchor="end">ch 20 · captured 4213 · devices 16</text>
  <line x1="0" y1="52" x2="860" y2="52" stroke="#2a3340"/>

  <!-- tabs -->
  <g font-size="12" font-weight="700">
    <rect x="20" y="64" width="86" height="30" rx="7" fill="#161b22" stroke="#2a3340"/><text x="63" y="84" fill="#e6edf3" text-anchor="middle">Overview</text>
    <rect x="112" y="64" width="94" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="159" y="84" fill="#8b97a3" text-anchor="middle">Live frames</text>
    <rect x="212" y="64" width="96" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="260" y="84" fill="#8b97a3" text-anchor="middle">RF spectrum</text>
    <rect x="314" y="64" width="104" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="366" y="84" fill="#8b97a3" text-anchor="middle">Active testing</text>
    <rect x="424" y="64" width="98" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="473" y="84" fill="#8b97a3" text-anchor="middle">Diagnostics</text>
    <rect x="528" y="64" width="62" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="559" y="84" fill="#8b97a3" text-anchor="middle">Config</text>
    <rect x="596" y="64" width="60" height="30" rx="7" fill="#0f141a" stroke="#2a3340"/><text x="626" y="84" fill="#8b97a3" text-anchor="middle">About</text>
  </g>

  <!-- description cards -->
  <g font-size="11">
    <rect x="20" y="112" width="270" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="34" y="134" fill="#58a6ff" font-size="12" font-weight="700">Overview</text>
    <text x="34" y="154" fill="#8b97a3">Devices in range, the live routing tree,</text>
    <text x="34" y="170" fill="#8b97a3">and logged incidents. Your home base.</text>

    <rect x="300" y="112" width="270" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="314" y="134" fill="#58a6ff" font-size="12" font-weight="700">Live frames</text>
    <text x="314" y="154" fill="#8b97a3">Capture controls (start/stop/channel)</text>
    <text x="314" y="170" fill="#8b97a3">+ decoded frames as they arrive.</text>

    <rect x="580" y="112" width="260" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="594" y="134" fill="#58a6ff" font-size="12" font-weight="700">RF spectrum</text>
    <text x="594" y="154" fill="#8b97a3">Energy per channel + waterfall,</text>
    <text x="594" y="170" fill="#8b97a3">Wi-Fi overlap, peak-hold.</text>

    <rect x="20" y="212" width="270" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="34" y="234" fill="#58a6ff" font-size="12" font-weight="700">Active testing</text>
    <text x="34" y="254" fill="#8b97a3">Probe a device (TX) to confirm it's</text>
    <text x="34" y="270" fill="#8b97a3">alive; schedule recurring probes.</text>

    <rect x="300" y="212" width="270" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="314" y="234" fill="#58a6ff" font-size="12" font-weight="700">Diagnostics</text>
    <text x="314" y="254" fill="#8b97a3">Automatic findings (syslog-leveled,</text>
    <text x="314" y="270" fill="#8b97a3">filterable) + connection &amp; logs.</text>

    <rect x="580" y="212" width="260" height="88" rx="8" fill="#161b22" stroke="#2a3340"/>
    <text x="594" y="234" fill="#58a6ff" font-size="12" font-weight="700">Config</text>
    <text x="594" y="254" fill="#8b97a3">Theme, key, Home Assistant, export,</text>
    <text x="594" y="270" fill="#8b97a3">radio roles, firmware update (OTA).</text>
  </g>

  <rect x="20" y="320" width="820" height="90" rx="8" fill="#0f141b" stroke="#2a3340"/>
  <text x="34" y="344" fill="#8b97a3" font-size="12" font-weight="700">ALWAYS VISIBLE (top bar)</text>
  <text x="34" y="366" fill="#8b97a3" font-size="11">● receiving from device — the host is getting data over USB.   ● capturing · ch N — the radio is actively sniffing (green pulse).</text>
  <text x="34" y="386" fill="#8b97a3" font-size="11">Capture keeps running when you switch tabs — only Stop ends it.</text>
</svg>
