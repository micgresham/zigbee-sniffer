<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="340" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="18" font-weight="700">Zigbee Sniffer · Tethered — how it fits together</text>

  <!-- Zigbee network -->
  <rect x="24" y="70" width="180" height="230" rx="10" fill="#161b22" stroke="#2a3340"/>
  <text x="114" y="96" fill="#8b97a3" font-size="12" text-anchor="middle" font-weight="700">YOUR ZIGBEE NETWORK</text>
  <circle cx="70" cy="140" r="16" fill="#58a6ff"/><text x="70" y="144" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">C</text>
  <text x="70" y="170" fill="#8b97a3" font-size="10" text-anchor="middle">coordinator</text>
  <circle cx="150" cy="150" r="11" fill="#c9d4e0"/><circle cx="120" cy="210" r="8" fill="#8b97a3"/>
  <circle cx="70" cy="230" r="11" fill="#c9d4e0"/><circle cx="160" cy="235" r="8" fill="#8b97a3"/>
  <line x1="70" y1="156" x2="150" y2="150" stroke="#3fb950" stroke-width="1.5" opacity=".6"/>
  <line x1="70" y1="156" x2="70" y2="219" stroke="#d29922" stroke-width="1.5" opacity=".6"/>
  <line x1="70" y1="230" x2="120" y2="210" stroke="#3fb950" stroke-width="1.5" opacity=".6"/>
  <line x1="150" y1="150" x2="160" y2="227" stroke="#f85149" stroke-width="1.5" opacity=".6"/>
  <text x="114" y="290" fill="#5b6672" font-size="10" text-anchor="middle">lights · sensors · routers</text>

  <!-- RF arrow -->
  <text x="243" y="180" fill="#8b97a3" font-size="11" text-anchor="middle">802.15.4</text>
  <text x="243" y="196" fill="#8b97a3" font-size="11" text-anchor="middle">RF (2.4GHz)</text>
  <path d="M214 210 h58" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0l7 3-7 3z" fill="#58a6ff"/></marker></defs>

  <!-- C6 -->
  <rect x="284" y="120" width="150" height="120" rx="10" fill="#161b22" stroke="#2a3340"/>
  <text x="359" y="146" fill="#8b97a3" font-size="12" text-anchor="middle" font-weight="700">ESP32-C6</text>
  <text x="359" y="164" fill="#e6edf3" font-size="11" text-anchor="middle">tethered firmware</text>
  <text x="359" y="186" fill="#5b6672" font-size="10" text-anchor="middle">captures frames,</text>
  <text x="359" y="200" fill="#5b6672" font-size="10" text-anchor="middle">energy-detect scan,</text>
  <text x="359" y="214" fill="#5b6672" font-size="10" text-anchor="middle">active probe (TX)</text>

  <!-- USB arrow -->
  <text x="470" y="196" fill="#8b97a3" font-size="11" text-anchor="middle">USB</text>
  <path d="M434 210 h56" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- Host -->
  <rect x="502" y="90" width="200" height="180" rx="10" fill="#161b22" stroke="#2a3340"/>
  <text x="602" y="116" fill="#8b97a3" font-size="12" text-anchor="middle" font-weight="700">zbsniff — Go host</text>
  <text x="602" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">decode · decrypt (AES)</text>
  <text x="602" y="156" fill="#e6edf3" font-size="11" text-anchor="middle">SQLite store</text>
  <text x="602" y="174" fill="#e6edf3" font-size="11" text-anchor="middle">diagnostics · routing</text>
  <text x="602" y="192" fill="#e6edf3" font-size="11" text-anchor="middle">REST + WebSocket</text>
  <text x="602" y="216" fill="#5b6672" font-size="10" text-anchor="middle">single binary — runs on a</text>
  <text x="602" y="230" fill="#5b6672" font-size="10" text-anchor="middle">PC, a Pi, or as a</text>
  <text x="602" y="244" fill="#7c5cff" font-size="10" text-anchor="middle" font-weight="700">Home Assistant add-on</text>

  <!-- HTTP arrow -->
  <text x="738" y="196" fill="#8b97a3" font-size="11" text-anchor="middle">http</text>
  <path d="M702 210 h30" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- browser -->
  <rect x="744" y="150" width="96" height="120" rx="10" fill="#161b22" stroke="#2a3340"/>
  <text x="792" y="176" fill="#8b97a3" font-size="12" text-anchor="middle" font-weight="700">BROWSER</text>
  <text x="792" y="198" fill="#e6edf3" font-size="11" text-anchor="middle">web UI</text>
  <text x="792" y="220" fill="#5b6672" font-size="10" text-anchor="middle">devices,</text>
  <text x="792" y="234" fill="#5b6672" font-size="10" text-anchor="middle">routing,</text>
  <text x="792" y="248" fill="#5b6672" font-size="10" text-anchor="middle">spectrum…</text>

  <text x="24" y="326" fill="#5b6672" font-size="11">Optional: 1–4 C6 dongles (roles: sniffer / spectrum / tester) · Home Assistant for friendly names + network LQI</text>
</svg>
