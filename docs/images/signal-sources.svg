<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="360" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="18" font-weight="700">Two very different signal readings — don't confuse them</text>

  <!-- room -->
  <rect x="24" y="60" width="500" height="280" rx="12" fill="#0f141b" stroke="#2a3340"/>

  <!-- sniffer -->
  <rect x="60" y="250" width="70" height="44" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="95" y="277" fill="#58a6ff" font-size="11" text-anchor="middle" font-weight="700">sniffer ⌖</text>

  <!-- router -->
  <circle cx="300" cy="120" r="18" fill="#c9d4e0"/>
  <text x="300" y="124" fill="#0d1117" font-size="10" text-anchor="middle" font-weight="700">R</text>
  <text x="300" y="96" fill="#8b97a3" font-size="11" text-anchor="middle">router</text>

  <!-- device -->
  <circle cx="410" cy="150" r="14" fill="#8b97a3"/>
  <text x="410" y="182" fill="#8b97a3" font-size="11" text-anchor="middle">device</text>

  <!-- strong network link device<->router -->
  <line x1="396" y1="146" x2="316" y2="126" stroke="#3fb950" stroke-width="3"/>
  <text x="356" y="128" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="700">strong</text>
  <text x="356" y="180" fill="#3fb950" font-size="10" text-anchor="middle">device↔router: close &amp; strong</text>

  <!-- weak sniffer hearing -->
  <line x1="120" y1="258" x2="398" y2="158" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/>
  <text x="250" y="235" fill="#f85149" font-size="11" text-anchor="middle" font-weight="700">weak ⌖ (far from sniffer)</text>

  <text x="274" y="322" fill="#8b97a3" font-size="12" text-anchor="middle">Same device — heard weakly by the sniffer, yet perfectly linked on the mesh.</text>

  <!-- right panel: which is which -->
  <rect x="548" y="60" width="288" height="280" rx="12" fill="#161b22" stroke="#2a3340"/>
  <text x="568" y="88" fill="#8b97a3" font-size="12" font-weight="700">WHICH READING IS WHICH?</text>

  <circle cx="576" cy="120" r="5" fill="#58a6ff"/>
  <text x="592" y="118" fill="#e6edf3" font-size="12" font-weight="700">RSSI ⌖ / Qual ⌖ (sniffer)</text>
  <text x="592" y="136" fill="#8b97a3" font-size="11">how loud the sniffer hears it —</text>
  <text x="592" y="152" fill="#8b97a3" font-size="11">depends where the sniffer sits.</text>

  <circle cx="576" cy="184" r="5" fill="#3fb950"/>
  <text x="592" y="182" fill="#e6edf3" font-size="12" font-weight="700">Net LQI (from Home Assistant)</text>
  <text x="592" y="200" fill="#8b97a3" font-size="11">the coordinator's view of the</text>
  <text x="592" y="216" fill="#8b97a3" font-size="11">device's actual link. The truth.</text>

  <circle cx="576" cy="248" r="5" fill="#d29922"/>
  <text x="592" y="246" fill="#e6edf3" font-size="12" font-weight="700">Active probe RSSI</text>
  <text x="592" y="264" fill="#8b97a3" font-size="11">measured from a chosen radio's</text>
  <text x="592" y="280" fill="#8b97a3" font-size="11">location — move it near a device.</text>

  <text x="568" y="316" fill="#5b6672" font-size="10">"Weak link" in Diagnostics is INFO — it's the sniffer's</text>
  <text x="568" y="330" fill="#5b6672" font-size="10">vantage, not a mesh problem.</text>
</svg>
