; Zigbee Sniffer & Diagnostics Platform — firmware
; Three build profiles over one shared capture core (src/core).
;   standalone   : WiFi + web UI + on-device analytics  (primary, no PC)
;   tethered     : lean, WiFi off, framed USB serial      (radio dongle -> host app)
;   satellite    : lean, WiFi off, SPI-slave forward      (carrier multi-radio)
;
; Board: ESP32-C6-DevKitC-1 for the primary; the same envs flash any ESP32-C6
; (e.g. ESP32-C6 SuperMini) for satellites/dongles.

[platformio]
default_envs = standalone
src_dir = src

[env]
platform = espressif32
framework = espidf
board = esp32-c6-devkitc-1
upload_port = /dev/cu.usbmodem14201
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DPROTO_VER=1
    -DFW_MAJOR=0
    -DFW_MINOR=33
    -Wall

; ---- Tethered: USB radio dongle -> host app (Go/Python) -------------------
; (device firmware; pair with the tethered host in ../tether. Build flag stays
;  BUILD_USB_SNIFFER internally; the env is named "tethered" for clarity.)
; NOTE on per-env sdkconfig overrides: `board_build.sdkconfig_defaults` is NOT a
; key this PlatformIO/ESP-IDF integration reads (verified: it appears nowhere in
; the espidf.py builder, and the three generated sdkconfig.<env> files were
; byte-for-byte identical despite each sdkconfigs/<env>.defaults intending real
; differences — WiFi/HTTPD-WS for standalone, console routing for tethered,
; flash size for satellite. None of it was ever applied). The mechanism that
; actually works is ESP-IDF's own SDKCONFIG_DEFAULTS CMake variable, passed
; through via `board_build.cmake_extra_args` (-> board.get("build.cmake_extra_args")
; in espidf.py, forwarded verbatim to the CMake configure step).

[env:tethered]
build_flags =
    ${env.build_flags}
    -DBUILD_USB_SNIFFER=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfigs/tethered.defaults"
; OTA-capable table (two app slots) so the tethered C6 can self-update over serial.
board_build.partitions = partitions_ota.csv

; ---- Standalone diagnostic primary (Block B) ------------------------------
[env:standalone]
build_flags =
    ${env.build_flags}
    -DBUILD_STANDALONE=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfigs/standalone.defaults"
; lite UI is compiled in as a C byte array (src/standalone/web_assets/web_assets.c)

; ---- Carrier satellite (Block D) ------------------------------------------
[env:satellite]
build_flags =
    ${env.build_flags}
    -DBUILD_SATELLITE=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfigs/satellite.defaults"
; OTA-capable table so satellites can be updated over SPI (fits 4 MB too).
board_build.partitions = partitions_ota.csv
; Satellite hardware is the ESP32-C6 SuperMini (ESP32-C6FH4, 4 MB flash), unlike
; the 8 MB DevKitC-1 the shared `board =` above defaults to (board.upload.flash_size
; = "8MB"). This is what elf2image bakes into the .bin header's flash-size field —
; independent of the CONFIG_ESPTOOLPY_FLASHSIZE sdkconfig override above, which
; only affects the app's own runtime view. Both must agree with the real chip and
; with each other, or the boot ROM's flash-size probe fails and crash-loops:
;   E spi_flash: Detected size(4096k) smaller than the size in the binary
;   image header(8192k). Probe failed.
board_upload.flash_size = 4MB
