# Plain-Docker / dev deployment (non-HA hosts). Same binary as the HA add-on.
#   cd addon && docker compose up --build
# Build context is the repo root so tether/ is included.
services:
  zbsniff:
    build:
      context: ..
      dockerfile: addon/Dockerfile
    image: zbsniff:latest
    container_name: zbsniff
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - zbsniff-data:/data
    devices:
      # Map your sniffer dongle(s) — adjust to your host paths.
      - "/dev/ttyACM0:/dev/ttyACM0"
    # Bypass run.sh (which expects HA's options.json) and call zbsniff directly.
    entrypoint: ["/usr/bin/zbsniff"]
    command: >-
      --port /dev/ttyACM0
      --db /data/zbsniff.sqlite --config /data/zbsniff.yaml --http-port 8080

volumes:
  zbsniff-data:
